<svg xmlns="http://www.w3.org/2000/svg" width="880" height="518" viewBox="0 0 880 518" role="img" aria-label="Layered: Presentation, Domain, Data architecture and a four-step level generator that avoids an expensive solver."><title>Layered: Presentation, Domain, Data architecture and a four-step level generator that avoids an expensive solver.</title><defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#111111"/></marker><marker id="aac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#C2410C"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#6B6B66"/></marker></defs><rect x=".5" y=".5" width="879" height="517" fill="#FAFAF8" stroke="#111111" stroke-opacity=".9"/><text x="40" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="2.5">03 / LAYERED</text><text x="840" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="end" letter-spacing="1.2">FLUTTER · OFFLINE · 100 LEVELS</text><line x1="40" y1="60" x2="840" y2="60" stroke="#D6D6D0" stroke-width="1"/><text x="40" y="104" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="-0.8">Skip the expensive solver.</text><text x="40" y="144" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#111111" letter-spacing="-0.8">Constrain the generator instead<tspan fill="#C2410C">.</tspan></text><text x="40" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="1.5">FIG. 03A — ARCHITECTURE</text><text x="440" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="1.5">FIG. 03B — LEVEL GENERATOR</text><rect x="40" y="202" width="340" height="70" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="56" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="1.5">PRESENTATION</text><text x="56" y="254" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">Screens · Cubits · Widgets</text><line x1="210" y1="275" x2="210" y2="291" stroke="#111111" stroke-width="1.25" marker-end="url(#aink)"/><rect x="40" y="294" width="340" height="70" fill="#EFEFEB" stroke="#111111" stroke-width="1"/><text x="56" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="1.5">DOMAIN</text><text x="56" y="346" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">Level model · Move rules · Generator</text><line x1="210" y1="367" x2="210" y2="383" stroke="#111111" stroke-width="1.25" marker-end="url(#aink)"/><rect x="40" y="386" width="340" height="70" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="56" y="416" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="1.5">DATA</text><text x="56" y="438" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">Hive · Firebase Analytics</text><rect x="440" y="202" width="400" height="46" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="456" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#C2410C" text-anchor="start" letter-spacing="0">1</text><text x="480" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0.6">CONTROLLED SCRAMBLING</text><text x="480" y="238" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">randomness with a leash</text><line x1="460" y1="249" x2="460" y2="255" stroke="#6B6B66" stroke-width="1.25" marker-end="url(#agr)"/><rect x="440" y="256" width="400" height="46" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="456" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#C2410C" text-anchor="start" letter-spacing="0">2</text><text x="480" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0.6">VALID-MOVE CONSTRAINTS</text><text x="480" y="292" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">only legal transitions</text><line x1="460" y1="303" x2="460" y2="309" stroke="#6B6B66" stroke-width="1.25" marker-end="url(#agr)"/><rect x="440" y="310" width="400" height="46" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="456" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#C2410C" text-anchor="start" letter-spacing="0">3</text><text x="480" y="330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0.6">DEADLOCK DETECTION</text><text x="480" y="346" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">reject dead ends</text><line x1="460" y1="357" x2="460" y2="363" stroke="#6B6B66" stroke-width="1.25" marker-end="url(#agr)"/><rect x="440" y="364" width="400" height="46" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="456" y="392" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#C2410C" text-anchor="start" letter-spacing="0">4</text><text x="480" y="384" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0.6">HOMOGENEITY SCORING</text><text x="480" y="400" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">measure quality, not just validity</text><rect x="440" y="418" width="400" height="38" fill="#111111" stroke="#111111" stroke-width="1"/><text x="456" y="442" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.5">→ LEVEL N / 100 · fully offline</text><line x1="40" y1="480" x2="840" y2="480" stroke="#D6D6D0" stroke-width="1" stroke-dasharray="2 3"/><text x="40" y="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">TRADEOFF  Heuristic checks instead of a full solver: cheaper generation, no optimality proof.</text></svg>