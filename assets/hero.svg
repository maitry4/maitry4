ans-serif" font-size="44" font-weight="700" fill="#111111" letter-spacing="-1.2">into simple, reliable software<tspan fill="#C2410C">.</tspan></text><text x="40" y="242" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">Backend · Mobile · AI Systems</text><text x="40" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="1.5">FIG. 00 — FROM PROBLEM TO PRODUCT</text><rect x="40" y="302" width="176" height="92" fill="none" stroke="#6B6B66" stroke-width="1" stroke-dasharray="4 3"/><text x="54" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="1.2">A / INPUT</text><text x="54" y="354" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0">Messy problem</text><text x="54" y="374" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">unclear, conflicting, costly</text><line x1="221" y1="348" x2="243" y2="348" stroke="#111111" stroke-width="1.25" marker-end="url(#aink)"/><rect x="248" y="302" width="176" height="92" fill="#EFEFEB" stroke="#D6D6D0" stroke-width="1"/><text x="262" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="1.2">B / DECISION</text><text x="262" y="354" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0">Product decision</text><text x="262" y="374" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">decide what not to build</text><line x1="429" y1="348" x2="451" y2="348" stroke="#111111" stroke-width="1.25" marker-end="url(#aink)"/><rect x="456" y="302" width="176" height="92" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="470" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="1.2">C / SYSTEM</text><text x="470" y="354" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0">System</text><text x="470" y="374" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">constraints shape it</text><line x1="637" y1="348" x2="659" y2="348" stroke="#111111" stroke-width="1.25" marker-end="url(#aink)"/><rect x="664" y="302" width="176" height="92" fill="#111111" stroke="#111111" stroke-width="1"/><text x="678" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#BDBDB6" text-anchor="start" letter-spacing="1.2">D / OUTPUT</text><text x="678" y="354" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">User experience</text><text x="678" y="374" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#D6D6D0" text-anchor="start" letter-spacing="0">fast, simple, private</text><path d="M160 326 l8 -9 l6 13 l-14 2 l13 9 l8 -11 l6 7" fill="none" stroke="#6B6B66" stroke-width="1"/><line x1="40" y1="418" x2="840" y2="418" stroke="#D6D6D0" stroke-width="1" stroke-dasharray="2 3"/><text x="40" y="438" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">Messy in. Simple out. The complexity lives underneath.</text></svg>