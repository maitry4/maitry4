<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img" aria-label="Noodle architecture: User, Flutter, WebSocket, FastAPI, Gemini and TTS, Response, then Discard."><title>Noodle architecture: User, Flutter, WebSocket, FastAPI, Gemini and TTS, Response, then Discard.</title><defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#111111"/></marker><marker id="aac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#C2410C"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#6B6B66"/></marker></defs><rect x=".5" y=".5" width="879" height="371" fill="#FAFAF8" stroke="#111111" stroke-opacity=".9"/><text x="40" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="2.5">01 / NOODLE</text><text x="840" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="end" letter-spacing="1.2">PRIVACY-FIRST · VOICE · MOBILE + BACKEND</text><line x1="40" y1="60" x2="840" y2="60" stroke="#D6D6D0" stroke-width="1"/><text x="40" y="102" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="-0.8">A sarcastic voice companion</text><text x="40" y="142" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#111111" letter-spacing="-0.8">that forgets you on purpose<tspan fill="#C2410C">.</tspan></text><text x="40" y="176" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">Privacy was not a settings toggle. It was the first architectural constraint.</text><text x="40" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="1.5">FIG. 01 — ONE TURN OF CONVERSATION</text><rect x="40.0" y="228" width="94" height="52" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="87.0" y="259" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0.4">USER</text><line x1="137.0" y1="254" x2="154.66666666666669" y2="254" stroke="#111111" stroke-width="1.25" marker-end="url(#aink)"/><rect x="157.66666666666669" y="228" width="94" height="52" fill="#EFEFEB" stroke="#111111" stroke-width="1"/><text x="204.66666666666669" y="259" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0.4">FLUTTER</text><line x1="254.66666666666669" y1="254" x2="272.33333333333337" y2="254" stroke="#111111" stroke-width="1.25" marker-end="url(#aink)"/><rect x="275.33333333333337" y="228" width="94" height="52" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="322.33333333333337" y="259" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0.4">WEBSOCKET</text><line x1="372.33333333333337" y1="254" x2="390.0" y2="254" stroke="#111111" stroke-width="1.25" marker-end="url(#aink)"/><rect x="393.0" y="228" width="94" height="52" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="440.0" y="259" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0.4">FASTAPI</text><line x1="490.0" y1="254" x2="507.6666666666667" y2="254" stroke="#111111" stroke-width="1.25" marker-end="url(#aink)"/><rect x="510.6666666666667" y="228" width="94" height="52" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="557.6666666666667" y="259" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0.4">GEMINI + TTS</text><line x1="607.6666666666667" y1="254" x2="625.3333333333334" y2="254" stroke="#111111" stroke-width="1.25" marker-end="url(#aink)"/><rect x="628.3333333333334" y="228" width="94" height="52" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="675.3333333333334" y="259" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0.4">RESPONSE</text><line x1="725.3333333333334" y1="254" x2="743.0" y2="254" stroke="#C2410C" stroke-width="1.25" marker-end="url(#aac)"/><rect x="746.0" y="228" width="94" height="52" fill="none" stroke="#C2410C" stroke-width="1" stroke-dasharray="4 3"/><text x="793.0" y="259" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#C2410C" text-anchor="middle" letter-spacing="0.4">DISCARD</text><path d="M157.66666666666669 288 v6 H251.66666666666669 v-6" fill="none" stroke="#6B6B66" stroke-width="1"/><text x="204.66666666666669" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9" font-weight="400" fill="#6B6B66" text-anchor="middle" letter-spacing="0.8">ON DEVICE</text><path d="M275.33333333333337 288 v6 H369.33333333333337 v-6" fill="none" stroke="#6B6B66" stroke-width="1"/><text x="322.33333333333337" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9" font-weight="400" fill="#6B6B66" text-anchor="middle" letter-spacing="0.8">LIVE STREAM</text><path d="M393.0 288 v6 H604.6666666666667 v-6" fill="none" stroke="#6B6B66" stroke-width="1"/><text x="498.83333333333337" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9" font-weight="400" fill="#6B6B66" text-anchor="middle" letter-spacing="0.8">STATELESS SERVER</text><path d="M746.0 288 v6 H840.0 v-6" fill="none" stroke="#C2410C" stroke-width="1"/><text x="793.0" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9" font-weight="400" fill="#C2410C" text-anchor="middle" letter-spacing="0.8">NOT STORED</text><line x1="40" y1="334" x2="840" y2="334" stroke="#D6D6D0" stroke-width="1" stroke-dasharray="2 3"/><text x="40" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start" letter-spacing="0">Nothing outlives the turn: audio and text exist only while a response is in flight.</text></svg>